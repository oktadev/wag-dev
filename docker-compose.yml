# Local stack: app + auth server + Redis. Production secrets come from the environment, never this file.
# Generate real ones with: pnpm --filter @wag/auth-server keys
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  auth-server:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: auth-server
    environment:
      NODE_ENV: development             # local stack only: throwaway keys, http issuer. Deploys keep the production guard.
      ISSUER: http://auth-server:4100   # the aud the mock WIdP signs; the app reaches the AS at this name
      REDIS_URL: redis://redis:6379
      INTERNAL_TOKEN: local-dev-internal-token-change-me-0123456789
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4100:4100"

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: app
    environment:
      AS_URL: http://auth-server:4100
      INTERNAL_TOKEN: local-dev-internal-token-change-me-0123456789
    depends_on:
      auth-server:
        condition: service_healthy
    ports:
      - "3000:3000"
